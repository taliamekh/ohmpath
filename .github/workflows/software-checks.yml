name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: software-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-and-desktop:
    name: Python and desktop software checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python v6
        with:
          python-version: "3.12"

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip install --no-deps -e .

      - name: Verify generated contracts
        run: python scripts/generate-contracts.py --check

      - name: Lint Python packages and tests
        run: ruff check services/bench/src services/bench/tests services/pi/src services/pi/tests

      - name: Install ngspice for actual simulator tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          ngspice --version

      - name: Run Python unit and integration tests
        run: pytest -q -rs

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # pnpm/setup v2
        with:
          version: "11.25.0"
          runtime: "node@24"
          install: false

      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop renderer
        run: pnpm run build

      - name: Run desktop bridge unit tests
        run: pnpm run test:desktop-unit
